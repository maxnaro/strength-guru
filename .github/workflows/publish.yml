name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ipa_size: ${{ steps.size.outputs.size }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Cache llama.xcframework
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/llama.xcframework
          key: llama-xcframework-v0.9.0-dev.6

      - name: Fetch llama.xcframework
        run: |
          if [ ! -d "ios/Frameworks/llama.xcframework" ]; then
            mkdir -p ios/Frameworks
            curl -fL -o llama-xcframework.zip \
              "https://github.com/netdur/llama_cpp_dart/releases/download/v0.9.0-dev.6/llama-xcframework.zip"
            unzip -q llama-xcframework.zip -d ios/Frameworks/
            rm llama-xcframework.zip
            test -d ios/Frameworks/llama.xcframework
          fi

      - name: Pod install
        run: cd ios && pod install

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=GIT_SHA=${{ github.sha }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r StrengthGuru.ipa Payload/

      - name: Get IPA size
        id: size
        run: |
          SIZE=$(stat -f%z StrengthGuru.ipa)
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: StrengthGuru.ipa

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ipa
          path: ./pages

      - name: Generate latest.json
        run: |
          cat > ./pages/latest.json <<EOF
          {
            "name": "Strength Guru",
            "subtitle": "Builds from main",
            "description": "Automatic builds of strength-guru from the main branch.",
            "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/images/logo.png",
            "website": "https://github.com/${{ github.repository }}",
            "apps": [
              {
                "name": "Strength Guru",
                "bundleIdentifier": "io.github.maxnaro.strengthGuru",
                "developerName": "maxnaro",
                "subtitle": "Workout tracker",
                "localizedDescription": "Personal workout tracking app, auto-built from main.",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/images/logo.png",
                "tintColor": "#000000",
                "category": "lifestyle",
                "screenshotURLs": [],
                "versions": [
                  {
                    "version": "${{ needs.build.outputs.version }}",
                    "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "localizedDescription": "Build ${{ github.run_number }} from commit ${{ github.sha }}",
                    "downloadURL": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/StrengthGuru.ipa",
                    "size": ${{ needs.build.outputs.ipa_size }}
                  }
                ]
              }
            ]
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
