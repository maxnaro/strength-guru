name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ipa_size: ${{ steps.size.outputs.size }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec
        id: version
        run: |
          # Extract version, strip build number, and normalize alpha suffix for iOS (e.g., 0.1.0-alpha.1 -> 0.1.0.1)
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1 | sed 's/-alpha\././g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Cache llama.xcframework
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/llama.xcframework
          key: llama-xcframework-v0.9.0-dev.6

      - name: Fetch llama.xcframework
        run: |
          if [ ! -d "ios/Frameworks/llama.xcframework" ]; then
            mkdir -p ios/Frameworks
            curl -fL -o llama-xcframework.zip \
              "https://github.com/netdur/llama_cpp_dart/releases/download/v0.9.0-dev.6/llama-xcframework.zip"
            unzip -q llama-xcframework.zip -d ios/Frameworks/
            rm llama-xcframework.zip
            test -d ios/Frameworks/llama.xcframework
          fi

      - name: Pod install
        run: |
          # Configure git to handle large payloads and slow connections
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          
          cd ios
          # Retry pod install up to 3 times to handle transient network/GitHub 500 errors
          for i in {1..3}; do
            pod install && break || {
              if [ $i -lt 3 ]; then
                echo "Pod install failed, retrying in 10 seconds..."
                sleep 10
              else
                echo "Pod install failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=GIT_SHA=${{ github.sha }}

      - name: Verify llama symbols in Runner binary
        run: |
          BIN=build/ios/iphoneos/Runner.app/Runner
          file "$BIN"
          echo "--- size ---"
          ls -la "$BIN"
          echo "--- llama_* symbols ---"
          if nm -gU "$BIN" | grep -E ' _llama_' | head -20; then
            echo "OK: llama symbols present in Runner binary"
          else
            echo "ERROR: llama symbols missing from Runner binary"
            echo "--- OTHER_LDFLAGS in pbxproj (Runner target) ---"
            grep -n -B1 -A3 OTHER_LDFLAGS ios/Runner.xcodeproj/project.pbxproj || true
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r StrengthGuru.ipa Payload/

      - name: Get IPA size
        id: size
        run: |
          SIZE=$(stat -f%z StrengthGuru.ipa)
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: StrengthGuru.ipa

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: ipa
          path: ./pages

      - name: Generate latest.json
        run: |
          if [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            BASE_URL="https://${{ github.repository_owner }}.github.io"
          else
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          
          cat > ./pages/latest.json <<EOF
          {
            "name": "Strength Guru",
            "subtitle": "Builds from main",
            "description": "Automatic builds of strength-guru from the main branch.",
            "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/images/logo.png",
            "website": "https://github.com/${{ github.repository }}",
            "apps": [
              {
                "name": "Strength Guru",
                "bundleIdentifier": "io.github.maxnaro.strengthGuru",
                "developerName": "maxnaro",
                "subtitle": "Workout tracker",
                "localizedDescription": "Personal workout tracking app, auto-built from main.",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/images/logo.png",
                "tintColor": "#000000",
                "category": "lifestyle",
                "screenshotURLs": [],
                "versions": [
                  {
                    "version": "${{ needs.build.outputs.version }}",
                    "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "localizedDescription": "Build ${{ github.run_number }} from commit ${{ github.sha }}",
                    "downloadURL": "$BASE_URL/StrengthGuru.ipa",
                    "size": ${{ needs.build.outputs.ipa_size }}
                  }
                ]
              }
            ]
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
