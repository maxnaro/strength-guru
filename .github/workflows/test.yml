name: Web and API
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - run: dart pub get --enforce-lockfile
        working-directory: server
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm test && npm run build
        working-directory: frontend
        env:
          GIT_SHA: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npm run test:browser -- --output=test-results/chromium
        working-directory: frontend
      - run: npm run test:browser -- --output=test-results/firefox
        working-directory: frontend
        env:
          TEST_BROWSER: firefox
      - run: npm run test:browser -- --output=test-results/webkit
        working-directory: frontend
        env:
          TEST_BROWSER: webkit
      - run: npm run test:perf
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: strength-guru-browser-results
          path: |
            frontend/test-results
            frontend/playwright-report
      - uses: actions/upload-artifact@v7
        with:
          name: strength-guru-web
          path: frontend/build
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - run: dart pub get --enforce-lockfile
        working-directory: server
      - run: dart run tool/browser_fixtures.dart --check && dart analyze && dart test && dart build cli --target=bin/server.dart --output=build
        working-directory: server
  publish:
    name: Publish to Docker Hub
    needs: [frontend, api]
    if: >-
      github.repository == 'maxnaro/strength-guru' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: macksmacks/strength-guru
      APP_IMAGE: macksmacks/strength-guru:sha-${{ github.sha }}
      APP_ORIGIN: http://localhost:8080
      OIDC_ISSUER: https://issuer.example.invalid
      OIDC_CLIENT_ID: smoke-test
      OIDC_CLIENT_SECRET: smoke-test
      OIDC_OWNER_SUBJECT: smoke-test-owner
      COMPOSE_PROJECT_NAME: strength-guru-image-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --platform linux/amd64 --build-arg "GIT_SHA=$GITHUB_SHA" --tag "$APP_IMAGE" .
      - name: Check the application image
        run: |
          docker compose up --pull never --wait --wait-timeout 90
          curl -fsS http://localhost:8080/today > /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/sync)" = 401
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs app
      - name: Clean up the smoke test
        if: always()
        run: docker compose down --volumes
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push commit tag and promote latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker push "$APP_IMAGE"
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            docker tag "$APP_IMAGE" "$IMAGE_REPOSITORY:latest"
            docker push "$IMAGE_REPOSITORY:latest"
          fi
