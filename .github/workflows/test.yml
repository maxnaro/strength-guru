name: Web and API
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.web.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm test && npm run build
        working-directory: frontend
        env:
          GIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        id: web
        with:
          name: strength-guru-web
          path: frontend/build
          if-no-files-found: error
          overwrite: true
  browser:
    needs: frontend-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - run: dart pub get --enforce-lockfile
        working-directory: server
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.frontend-build.outputs.artifact-id }}
          path: frontend/build
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright browser
        run: |
          if [[ "$TEST_BROWSER" == chromium ]]; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --with-deps "$TEST_BROWSER"
          fi
        working-directory: frontend
      - run: npm run test:browser -- --output="test-results/$TEST_BROWSER"
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/browser
      - run: npm run test:perf
        if: matrix.browser == 'chromium'
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/performance
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: strength-guru-browser-results-${{ matrix.browser }}
          path: |
            frontend/test-results
            frontend/playwright-report
          overwrite: true
  frontend:
    needs: [frontend-build, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the frontend build and browser checks
        env:
          BUILD_RESULT: ${{ needs.frontend-build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - run: dart pub get --enforce-lockfile
        working-directory: server
      - run: dart run tool/browser_fixtures.dart --check && dart analyze && dart test && dart build cli --target=bin/server.dart --output=build
        working-directory: server
  publish:
    name: Publish to Docker Hub
    needs: [frontend, api]
    if: >-
      github.repository == 'maxnaro/strength-guru' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: macksmacks/strength-guru
      APP_IMAGE: macksmacks/strength-guru:sha-${{ github.sha }}
      APP_ORIGIN: http://localhost:8080
      COMPOSE_PROJECT_NAME: strength-guru-image-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build application image
        run: docker build --platform linux/amd64 --build-arg "GIT_SHA=$GITHUB_SHA" --tag "$APP_IMAGE" .
      - name: Check the application image
        run: |
          docker compose up --pull never --wait --wait-timeout 90
          curl -fsS http://localhost:8080/today > /dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs app
      - name: Clean up the smoke test
        if: always()
        run: docker compose down --volumes
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push commit tag and promote latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker push "$APP_IMAGE"
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            docker tag "$APP_IMAGE" "$IMAGE_REPOSITORY:latest"
            docker push "$IMAGE_REPOSITORY:latest"
          fi
