name: Web and API
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter@sha256:46691e311715845de03a3ba4753a475476936805b29431b1f00f1816981033f8
    steps:
      - uses: actions/checkout@v6
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Verify API and sync
        working-directory: server
        run: |
          dart pub get --enforce-lockfile
          dart analyze
          dart test
          dart build cli --target=bin/server.dart --output=build
      - name: Build offline web app
        run: |
          dart compile js -O4 web/drift_worker.dart -o web/drift_worker.dart.js
          flutter build web --wasm --no-web-resources-cdn --pwa-strategy=none
          python3 tool/prepare_web.py
          mkdir -p build/web/licenses
          cp LICENSE assets/fonts/*-OFL.txt build/web/licenses/
      - uses: actions/upload-artifact@v7
        with:
          name: strength-guru-web
          path: build/web
