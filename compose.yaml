name: strength-guru
services:
  app:
    image: ${APP_IMAGE:-maxnaro/strength-guru:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the HTTPS origin of your existing private proxy}
      TZ: ${TZ:-Europe/London}
    volumes:
      - training-data:/data
    # App startup deliberately does not depend on inference readiness.
    stop_grace_period: 15s
volumes:
  training-data:
