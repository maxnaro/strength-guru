name: strength-guru
services:
  app:
    image: ${APP_IMAGE:-macksmacks/strength-guru:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the HTTPS origin of your existing private proxy}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set the OpenID Connect issuer}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the OpenID Connect client ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set the OpenID Connect client secret}
      OIDC_OWNER_SUBJECT: ${OIDC_OWNER_SUBJECT:?Set the deployment owner's OpenID Connect subject}
      TZ: ${TZ:-Europe/London}
    volumes:
      - training-data:/data
    # App startup deliberately does not depend on inference readiness.
    stop_grace_period: 15s
volumes:
  training-data:
