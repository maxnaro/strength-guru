name: strength_guru
description: StrengthGuru — workout logger with previous-session placeholder feature.
publish_to: none
version: 0.1.3+4

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # DB
  drift: ^2.22.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  collection: ^1.18.0
  intl: ^0.19.0
  uuid: ^4.4.0
  http: ^1.2.0
  string_similarity: ^2.0.0
  file_picker: ^8.0.0
  llama_cpp_dart: 0.9.0-dev.6
  background_downloader: ^8.5.0
  wakelock_plus: ^1.2.1
  youtube_explode_dart: ^2.2.2
  youtube_player_iframe: ^5.2.1
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.22.0
  riverpod_generator: ^2.4.0
  custom_lint: 0.7.6
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    color: "#FFFFFF"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
