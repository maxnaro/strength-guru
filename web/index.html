<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Strength Guru">
  <meta name="description" content="Private strength training, with offline workout logging.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>Strength Guru</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0e0f12; overscroll-behavior: none; }
    #loading { color: #f2efe8; font: 16px system-ui; position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
    button { padding: 12px; font: inherit; }
  </style>
</head>
<body>
  <div id="loading" role="status">Opening Strength Guru…</div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.querySelector('#loading')?.remove());
    window.addEventListener('error', () => {
      const loading = document.querySelector('#loading');
      if (loading) loading.innerHTML = 'Could not load the app. Connect to your private server and try again.<p><button onclick="location.reload()">Retry</button></p>';
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (window.sgApplyUpdate) location.reload();
      });
      window.sgActivateUpdate = () => {
        window.sgApplyUpdate = true;
        navigator.serviceWorker.getRegistration('/').then(reg => {
          if (reg?.waiting) reg.waiting.postMessage('activate'); else location.reload();
        });
      };
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
